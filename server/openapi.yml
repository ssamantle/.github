openapi: "3.1.0"
info:
  title: Ssamantle Server
  version: "2.0.0"
servers:
  - url: https://localhost:8080/v2
    description: A Developement Server hosted on Localhost.
paths:
  /auth/email/request:
    post:
      tags: [auth]
      deprecated: true
      summary: 이메일 인증 요청
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: 이메일 주소입니다.
      responses:
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/email/verify:
    post:
      tags: [auth]
      deprecated: true
      summary: 이메일 인증
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, verificationToken]
              properties:
                email:
                  type: string
                  format: email
                  description: 이메일 주소입니다.
                verificationToken:
                  type: string
                  description: 인증 토큰입니다.
      responses:
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원 가입
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  description: 사용자명입니다.
                email:
                  type: string
                  format: email
                  description: 사용자 이메일 주소입니다.
                password:
                  type: string
                  format: password
                  description: 사용자 비밀번호입니다.
      responses:
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/signin:
    post:
      tags: [auth]
      summary: 회원 로그인
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: 사용자 이메일 주소입니다.
                password:
                  type: string
                  format: password
                  description: 사용자 비밀번호입니다.
      responses:
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /user/{userId}:
    parameters:
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    patch:
      tags: [user]
      summary: 사용자 정보 수정
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 사용자명입니다.
                password:
                  type: string
                  format: password
                  description: 사용자 비밀번호입니다.
      responses:
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game:
    get:
      tags: [game]
      summary: 참가 가능 게임 목록
    post:
      tags: [game]
      summary: 게임 생성
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/{gameId}:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 정보 보기
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [game]
      summary: 게임 정보 수정
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/{gameId}/player:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 참가자 목록
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [game]
      summary: 게임 참가
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/{gameId}/player/{userId}:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 참가자 게임 기록 정보
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [game]
      summary: 게임 참가자 기록 말소
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/{gameId}/player/{userId}/guess:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 참가자 제출 기록
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/{gameId}/guess:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    post:
      tags: [game]
      summary: 제출
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    name:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      description: |
        오류 메시지
        오류 발생 원인에 대한 설명이 담겨 있을 수도 있습니다.
      properties:
        message:
          type: string
          examples:
            - 잘못된 요청입니다.
            - 올바른 이메일 형식이 아닙니다.
            - 올바르지 않은 날짜 형식입니다.
