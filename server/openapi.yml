openapi: "3.1.0"
info:
  title: Ssamantle Server
  version: "2.0.0"
servers:
  - url: https://localhost:8080/v2
    description: A Developement Server hosted on Localhost.
paths:
  /auth/email/request:
    post:
      tags: [auth]
      deprecated: true
      summary: 이메일 인증 요청
  /auth/email/verify:
    post:
      tags: [auth]
      deprecated: true
      summary: 이메일 인증
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원 가입
  /auth/signin:
    post:
      tags: [auth]
      summary: 회원 로그인
  /user/{userId}:
    parameters:
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    patch:
      tags: [user]
      summary: 사용자 정보 수정
      security: [bearerAuth: []]
  /game:
    get:
      tags: [game]
      summary: 참가 가능 게임 목록
    post:
      tags: [game]
      summary: 게임 생성
      security: [bearerAuth: []]
  /game/{gameId}:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 정보 보기
      security: [bearerAuth: []]
    patch:
      tags: [game]
      summary: 게임 정보 수정
      security: [bearerAuth: []]
  /game/{gameId}/player:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 참가자 목록
      security: [bearerAuth: []]
    post:
      tags: [game]
      summary: 게임 참가
      security: [bearerAuth: []]
  /game/{gameId}/player/{userId}:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 참가자 게임 기록 정보
      security: [bearerAuth: []]
    delete:
      tags: [game]
      summary: 게임 참가자 기록 말소
      security: [bearerAuth: []]
  /game/{gameId}/player/{userId}/guess:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [game]
      summary: 게임 참가자 제출 기록
      security: [bearerAuth: []]
  /game/{gameId}/guess:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    post:
      tags: [game]
      summary: 제출
      security: [bearerAuth: []]
components:
  securitySchemes:
    name:
      type: http
      scheme: bearer
      bearerFormat: JWT
