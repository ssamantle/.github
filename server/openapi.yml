openapi: "3.1.0"
info:
  title: Ssamantle Server
  version: "2.0.0"
servers:
  - url: https://localhost:8080/v2
    description: A Developement Server hosted on Localhost.
paths:
  /auth/email/request:
    post:
      tags: [Auth]
      deprecated: true
      summary: 이메일 인증 요청
      description: |
        이메일 인증에 필요한 6자리 코드를 입력한 이메일로 발송합니다.

        응답에 명시된 인증 코드의 유효시간 동안만 해당 이메일로 인증이 가능합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: 요청이 정상적으로 처리되었습니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: string
                    format: date-time
                    description: 인증 코드의 유효 시간입니다. 명시된 시간이 지나면 코드는 파기됩니다.
        "400":
          description: 잘못된 이메일 형식 또는 이미 가입된 이메일.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 사용자가 지정된 시간에 너무 많은 요청을 보냈습니다. (Rate limiting)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            이 작업을 서버가 수행할 수 없습니다.

            서버에 STMP, POP 설정이 올바르게 구성되지 않았거나,
            서드파티 이메일 서버가 응답하지 않는 경우 이 응답코드가 반환됩니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/email/verify:
    post:
      tags: [Auth]
      deprecated: true
      summary: 이메일 인증
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: 이메일 주소입니다.
                verificationCode:
                  type: string
                  description: 이메일 인증에 필요한 6자리 인증 코드입니다.
                  example: "123456"
      responses:
        "200":
          description: |
            이메일 인증에 성공하였습니다.
            회원가입에 필요한 인증 토큰이 반환됩니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verificationToken:
                    type: string
                    format: uuid
                    description: 회원가입에 필요한 이메일 인증 토큰입니다.
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 코드 불일치 또는 만료된 인증 코드.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원 가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        "400":
          description: 요청 형식이 잘못됨 (필수 값 누락 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 이메일 인증 토큰이 유효하지 않거나 만료됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 사용자명이 중복됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signin:
    post:
      tags: [Auth]
      summary: 회원 로그인
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: 이메일 형식이 잘못되었거나, 이메일 또는 비밀번호가 누락됨.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 로그인 실패 (이메일 또는 비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/{userId}:
    parameters:
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [User]
      summary: 사용자 정보 조회
      description: 사용자의 식별자와 사용자명, 이메일을 조회합니다.
      security: [bearerAuth: []]
      responses:
        "200":
          description: 요청이 정상적으로 처리됨.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        # TODO: 304 Not Modified 사용하기
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음. (본인 혹은 관리자가 아님)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 존재하지 않는 사용자.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [User]
      # TODO: email 수정 지원하기
      summary: 사용자 정보 수정
      description: |
        사용자의 사용자명, 비밀번호를 수정합니다.
        일부 필드만 전송하여 수정할 수 있습니다.
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: 사용자 정보가 성공적으로 수정됨.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: 잘못된 형식이거나, 수정할 항목이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음. (본인 혹은 관리자가 아님)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 존재하지 않는 사용자.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game:
    get:
      tags: [Game]
      summary: 참가 가능 게임 목록
      description: |
        현재 참가 가능한 게임 목록을 조회합니다.
        이미 시작했거나 종료된 게임은 조회 가능한 대상에 포함되지 않습니다.
      responses:
        "200":
          description: 목록을 정상적으로 조회하였습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
    post:
      tags: [Game]
      summary: 게임 생성
      description: |
        게임을 생성합니다.
        이 작업은 관리자 혹은 관리자의 사전 승인을 받은 사용자만이 수행할 수 있습니다.
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCreateRequest"
      responses:
        "201":
          description: 게임이 성공적으로 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResponse"
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 정답 단어가 사전에 없음. (Out-of-Vocabulary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/{gameId}:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [Game]
      summary: 게임 정보 보기
      description: |
        정답을 포함하여 게임의 세부 정보를 조회합니다.
        관리자 혹은 이 게임의 생성자만 사용할 수 있습니다.
      security: [bearerAuth: []]
      responses:
        "200":
          description: 게임을 성공적으로 조회함.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임을 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Game]
      summary: 게임 정보 수정
      description: |
        게임의 제목, 시작 시간, 끝나는 시간을 수정합니다.

        일부 정보만 부분적으로 수정하는 것이 가능합니다.
        게임 시작 시간은 게임이 시작된 후에는 수정할 수 없습니다.
        게임 시작 시간 및 게임 종료 시각은 현재 시각으로 부터 10초 이내의 범위로는 수정할 수 없습니다.
        (클라이언트가 변경된 게임 시간 정보를 받아 올 수 있는 충분한 시간을 확보하기 위함.)

        관리자 혹은 이 게임의 생성자만 사용할 수 있습니다.
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdateRequest"
      responses:
        "200":
          description: 게임 정보를 성공적으로 수정함.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameUpdateResponse"
        "400":
          description: 아무 필드를 입력하지 않았거나, 날짜 형식이 잘못됨.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임을 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/{gameId}/polling:
    # TODO
    description: "TODO: 필요한가?"

  /game/{gameId}/player:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [Game]
      summary: 게임 참가자 목록
      security: [bearerAuth: []]
      responses:
        "200":
          description: 참가자 목록의 조회에 성공함.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePlayerListRequest"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Game]
      summary: 게임 참가
      description: 현재 로그인한 사용자가 해당 게임에 참가합니다.
      security: [bearerAuth: []]
      responses:
        "200":
          description: 게임에 성공적으로 참가함.
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임을 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/{gameId}/player/{userId}:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      # TODO
      tags: [Game]
      summary: 게임 참가자 게임 기록 정보
      security: [bearerAuth: []]
      responses:
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임 혹은 사용자를 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Game]
      summary: 게임 참가자 제거
      description: |
        게임에서 참가자를 제거합니다.
        게임 내 순위는 제거된 참가자를 제외한 후 다시 계산됩니다.
        제출 기록은 지워지지 않습니다.

        참가자 본인 혹은 관리자만 이 작업을 수행할 수 있습니다.
      security: [bearerAuth: []]
      responses:
        "204":
          description: 참가자를 성공적으로 제거함.
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임 혹은 사용자를 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/{gameId}/player/{userId}/guess:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: userId
        description: 사용자를 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    get:
      tags: [Game]
      summary: 게임 참가자 제출 기록
      description: |
        참가자가 제출한 단어들의 기록입니다.

        순위 권을 벗어났던 것과 사전에 없는(Out-of-Vocabulary)인 제출 기록도 조회됩니다.
        정답과의 유사도 순으로 1,000위 이상의 단어에는 유사도/정확도 정보(proximity)가 제공되지 않습니다.
      security: [bearerAuth: []]
      responses:
        "200":
          description: 사용자 제출 기록이 정상적으로 조회됨.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuessListResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임 혹은 사용자를 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/{gameId}/guess:
    parameters:
      - in: path
        required: true
        name: gameId
        description: 게임을 구분하는 고유 식별자입니다.
        schema:
          type: string
          format: uuid
    post:
      tags: [Game]
      summary: 게임 참가자 단어 제출
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameGuessSubmitRequest"
      responses:
        "200":
          description: 단어가 정상적으로 제출됨.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuessSubmitResponse"
        "400":
          description: 잘못된 형식입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 사용자가 인증되지 않음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 사용자에게 작업을 수행할 권한이 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게임을 찾을 수 없음.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            제출한 단어가 사전에 없음. (Out-of-Vocabulary)

            단어의 유사도, 정확도 정보는 제공되지 않습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuessSubmitResponseWithoutProximity"
        "429":
          description: 사용자가 지정된 시간에 너무 많은 요청을 보냄. (Rate limiting)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    name:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PageMeta:
      type: object
      description: 페이지네이션 메타데이터.
      required: [totalCount, page, size, totalPages]
      properties:
        totalCount:
          type: integer
          description: "전체 아이템 개수"
          example: 100
        page:
          type: integer
          description: "현재 페이지 번호 (1부터 시작)"
          example: 1
        size:
          type: integer
          description: "한 페이지당 보여줄 아이템 개수"
          example: 20
        totalPages:
          type: integer
          description: "전체 페이지 수"
          example: 5

    ErrorResponse:
      type: object
      description: |
        오류 메시지
        오류 발생 원인에 대한 설명이 담겨 있을 수도 있습니다.
      properties:
        message:
          type: string
          examples:
            - 잘못된 요청입니다.
            - 올바른 이메일 형식이 아닙니다.
            - 올바르지 않은 날짜 형식입니다.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: 사용자 이메일 주소입니다.
        password:
          type: string
          format: password
          description: 사용자 비밀번호입니다.

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType]
      properties:
        accessToken:
          type: string
          description: API 요청 시 Authorization 헤더에 사용할 Bearer 토큰
        refreshToken:
          type: string
          description: 액세스 토큰 만료 시 재발급을 위한 토큰
        tokenType:
          type: string
          example: "Bearer"

    UserSnippet:
      type: object
      description: |
        일반 사용자들에게 보여져도 되는 사용자 객체의 기본 구조입니다.
        시스템 식별자와 표시용 사용자명을 포함합니다.
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
          description: 사용자를 구분하는 고유 식별자입니다.
        username:
          type: string
          description: 게임 내에서 표시될 사용자명
          example: 최강파이터김동주

    UserResponse:
      description: |
        관리자가 사용자의 정보 조회 시 혹은
        사용자 본인의 정보를 조회하는 경우 반환되는 상세 정보 스키마입니다.
        이메일 및 계정 설정 상태 등 개인정보를 포함합니다.
      allOf:
        - $ref: "#/components/schemas/UserSnippet"
        - type: object
          required: [email, createdAt, updatedAt]
          properties:
            email:
              type: string
              format: email
              description: 계정 로그인을 위한 이메일 주소
            createdAt:
              type: string
              format: date-time
              description: 회원 가입 일시
            updatedAt:
              type: string
              format: date-time
              description: 회원 정보 수정 일시

    UserCreateRequest:
      type: object
      required: [username, email, emailVerificationToken, password]
      properties:
        email:
          type: string
          format: email
          description: 사용자 이메일 주소입니다.
        emailVerificationToken:
          type: string
          format: uuid
          description: 이메일 인증이 완료됨을 의미하는 토큰입니다.
        username:
          type: string
          description: 사용자명입니다.
        password:
          type: string
          format: password
          description: 사용자 비밀번호입니다.

    UserCreateResponse:
      $ref: "#/components/schemas/UserResponse"

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          description: 사용자명입니다.
        password:
          type: string
          format: password
          description: 사용자 비밀번호입니다.

    UserUpdateResponse:
      $ref: "#/components/schemas/UserResponse"

    GameSnippet:
      description: |
        일반 사용자에게 보여져도 되는 게임 정보입니다.
        시스템 식별자와 표시용 게임명을 포함합니다.
      type: object
      required: [id, title, startAt, endAt]
      properties:
        id:
          type: string
          format: uuid
          description: 게임을 구분하는 고유 식별자.
        title:
          type: string
          description: 게임의 제목.
          examples:
            - SSAFY 15기 4월 SSAFY DAY 대회
            - 김동주의 게임
        startAt:
          type: string
          format: date-time
          description: 게임이 시작되는 시간.
        endAt:
          type: string
          format: date-time
          description: 게임이 종료되는 시간.

    GameResponse:
      allOf:
        - $ref: "#/components/schemas/GameSnippet"
        - type: object
          required: [secretWord]
          properties:
            secretWord:
              type: string
              description: 정답 단어입니다.
              examples:
                - 사과
                - 정장
                - 영화
                - 사극
            createdAt:
              type: string
              format: date-time
              description: 게임 생성 일시
            updatedAt:
              type: string
              format: date-time
              description: 게임 수정 일시

    GameListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameSnippet"
        meta:
          $ref: "#/components/schemas/PageMeta"

    GameCreateRequest:
      type: object
      required: [title, secretWord, startAt, endAt]
      properties:
        title:
          type: string
          description: 게임의 제목.
          example: 김동주의 게임
        secretWord:
          type: string
          description: 정답 단어입니다.
          example: 봄바람
        startAt:
          type: string
          format: date-time
          description: 게임이 시작되는 시간.
        endAt:
          type: string
          format: date-time
          description: 게임이 종료되는 시간.

    GameCreateResponse:
      $ref: "#/components/schemas/GameResponse"

    GameUpdateRequest:
      type: object
      properties:
        title:
          type: string
          description: 게임의 제목.
          examples:
            - SSAFY 15기 4월 SSAFY DAY 대회
            - 김동주의 게임
        startAt:
          type: string
          format: date-time
          description: 게임이 시작되는 시간.
        endAt:
          type: string
          format: date-time
          description: 게임이 종료되는 시간.

    GameUpdateResponse:
      $ref: "#/components/schemas/GameResponse"

    PlayerSnippet:
      allOf:
        - $ref: "#/components/schemas/UserSnippet"
        - type: object
          properties:
            rank:
              type: integer
              description: |
                게임 내에서 참가자의 현재 순위

                1부터 시작하는 숫자로 구성됩니다.
                동일한 순위가 존재할 수 있으며, 동일한 순위가 있을경우 그 수만큼 다음 순위를 건너뜁니다.

                예시:
                데이터가 90, 90, 80, 70 이면 각각의 순위는 1, 1, 3, 4 입니다.
              minimum: 1
            bestProximity:
              $ref: "#/components/schemas/ProximitySnippet"
            recentProximity:
              $ref: "#/components/schemas/ProximitySnippet"

    GuessSnippet:
      type: object
      required: [order, word, submittedAt]
      properties:
        order:
          type: integer
          description: |
            제출 순위

            다른 참가자들의 제출을 포함하여
            이 게임에서 몇 번째 제출인지를 나타냅니다.
          minimum: 1
        word:
          type: string
          description: 사용자가 제출한 단어
        proximity:
          allOf:
            - $ref: "#/components/schemas/ProximitySnippet"
            - type: object
              required: [displayText]
              properties:
                displayText:
                  type: string
                  description: 클라이언트에 표시될 정확도 문구
                  examples:
                    - "113/1000"
                    - "cold"
                    - "tepid"
                    - "far"
                    - "1000위 이상" # TODO: 순위권 외 표기방식 결정하기
        submittedAt:
          type: string
          format: date-time
          description: 제출 시각 (서버 기준)

    ProximitySnippet:
      type:
        - object
        - "null"
      description: |
        제출된 단어와 정답 단어간의 유사도/정확도 정보입니다.

        제출한 단어가 Out-of-Vocabulary 인 경우에는 null 로 대체됩니다.
      required: [similarity, permille, normalizedSimilarity]
      properties:
        similarity:
          type: number
          description: 벡터 유사도
          example: 0.5612662
        permille:
          type:
            - integer
            - "null"
          description: |
            가장 가까운 999개의 단어 중 몇 번째인지

            정답에 가까울 수록 낮은 숫자가 주어지며
            순위 권 외(1000위 이상)이면 null 이 반환된다.
          minimum: 1
          maximum: 999
          example: null
        normalizedSimilarity:
          type: number
          description: -100 에서 100 사이로 정규화 된 유사도 수치
          example: 20.92

    GamePlayerListRequest:
      # TODO: 토론하기 - 과연 Pagination 해야하는가...
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSnippet"
        meta:
          $ref: "#/components/schemas/PageMeta"

    GameGuessSubmitRequest:
      type: object
      required: [word]
      properties:
        word:
          type: string
          description: 사용자가 추측한 단어

    GameGuessSubmitResponse:
      $ref: "#/components/schemas/GuessSnippet"

    GameGuessSubmitResponseWithoutProximity:
      allOf:
        - $ref: "#/components/schemas/GuessSnippet"
        - example:
            order: 172,
            word: 뷁
            submittedAt: "2026-05-05T17:36:16.874Z"

    GameGuessListResponse:
      # TODO: 토론하기 - 과연 Pagination 해야하는가...
      type: array
      items:
        $ref: "#/components/schemas/GuessSnippet"
      example:
        - order: 1
          word: "사과"
          proximity:
            similarity: 0.5612662
            permille: 19
            normalizedSimilarity: 40.92
            displayText: "19/1000"
          submittedAt: "2026-05-05T17:43:12.438Z"
        - order: 2
          word: "정장"
          proximity:
            similarity: -0.0412662
            permille: null
            normalizedSimilarity: -9.48
            displayText: "far"
          submittedAt: "2026-05-05T17:43:12.438Z"
        - order: 3
          word: "팬이에요"
          submittedAt: "2026-05-05T17:43:12.438Z"
